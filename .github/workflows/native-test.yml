name: Build native IC35 TEST 001
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-test-001:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test emitted Z80 subset and APP layout
        run: python3 -m unittest discover -s tests -v
      - name: Build native TEST001.APP
        run: python3 tools/build_test.py
      - name: Upload native APP and identification
        uses: actions/upload-artifact@v4
        with:
          name: IC35-TEST-001-NATIVE-APP
          path: build/IC35-TEST-001/
          if-no-files-found: error
          retention-days: 30
