name: Build IC35 apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test baseline, game, AI and bridge
        run: python3 -m unittest discover -s tests -v
      - name: Build unchanged TEST001.APP
        run: python3 tools/build_test.py
      - name: Upload baseline test APP
        uses: actions/upload-artifact@v4
        with:
          name: IC35-TEST-001-APP
          path: build/IC35-TEST-001/
          if-no-files-found: error
          retention-days: 30
      - name: Install open-source Z80 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sdcc
      - name: Build VIER.APP against AI
        run: python3 tools/build_game.py
      - name: Upload game APP and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: IC35-VIER-KI-009-APP
          path: build/IC35-VIER-KI-009/
          if-no-files-found: error
          retention-days: 30
